name: "deploy staging 🏗️"
on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  NUXT_SITE_ENV: staging # used for NuxtSEO to disable things like indexing on staging
  HUSKY: 0
  CI: true

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  build_and_deploy:
    env:
      NUXT_UI_PRO_LICENSE: ${{ secrets.NUXT_UI_PRO_LICENSE }}
      ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}
      ALGOLIA_APPLICATION_ID: ${{ secrets.ALGOLIA_APPLICATION_ID }}
    if: ${{ github.event.repository.full_name == github.repository }}
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "${{ github.event.inputs.ref }}"

      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1

      - name: "Install dependencies"
        run: bun install
      - name: "Deploy target: staging"
        run: bun run build

      - uses: matter-labs/action-hosting-deploy@4d0d0023f1d92b9b7d16dda64b3d7abd2c98974b # main
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMMUNITY_COOKBOOK_STAGING }}"
          projectId: community-cookbook-staging
          channelId: live
